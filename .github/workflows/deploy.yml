name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy Frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
      
      - name: Notify Render (Backend)
        run: |
          curl --no-buffer \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"deploy_key":"${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"}' \
            "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID_BACKEND }}"
        if: success()
      
      - name: Notify Render (ML API)
        run: |
          curl --no-buffer \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"deploy_key":"${{ secrets.RENDER_DEPLOY_HOOK_ML }}"}' \
            "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID_ML }}"
        if: success()
      
      - name: Deployment Status
        if: always()
        run: |
          echo "Deployment Status: ${{ job.status }}"
